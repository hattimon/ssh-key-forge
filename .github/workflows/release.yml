name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 paramiko pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SSHKeyForge --icon icon.ico --add-data "bg.mp3;." ssh_key_forge.py

      - name: Install NSIS
        run: |
          choco install nsis -y

      - name: Build Installer
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe",
            "$env:ProgramFiles(x86)\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "NSIS (makensis.exe) not found." }
          & $makensis installer\SSHKeyForge.nsi
          if (-not (Test-Path dist\SSHKeyForge-Setup.exe)) { throw "Installer not created." }

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path dist\SSHKeyForge.exe)) { throw "Portable EXE missing." }
          if (-not (Test-Path dist\SSHKeyForge-Setup.exe)) { throw "Installer EXE missing." }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SSHKeyForge.exe
            dist/SSHKeyForge-Setup.exe
          body_path: RELEASE_NOTES.md
          name: SSH Key Forge ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
